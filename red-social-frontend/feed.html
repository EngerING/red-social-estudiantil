<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect | Feed</title>
  <link rel="stylesheet" href="css/feed.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-section">
        <div class="brand-icon">&#127891;</div>
        <h1>CampusConnect</h1>
      </div>

      <nav class="menu">
        <button class="menu-btn active" type="button" data-link="feed.html">Home Feed</button>
        <button class="menu-btn" type="button" data-link="studygroups.html">Study Group Finder</button>
        <button class="menu-btn" type="button" data-link="profile.html">Student Profile</button>
        <button class="menu-btn" type="button" data-scroll-target="messagesSection">Messages</button>
      </nav>
    </aside>

    <main class="content">
      <div class="feed-layout">
        <section class="messages-section" id="messagesSection">
          <h2 class="section-title">Chat Academico</h2>

          <article class="chat-card">
            <p id="chatStatus" class="chat-status">Conectando al chat academico...</p>
            <div id="chatMessages" class="chat-messages"></div>

            <div class="chat-input-row">
              <input id="chatInput" type="text" placeholder="Escribe un mensaje..." />
              <button id="btnSendChat" class="chat-btn" type="button">Enviar</button>
            </div>
          </article>
        </section>

        <section class="top-section">
          <h2 class="section-title">Home Feed</h2>

          <article class="create-post-card">
            <h3>Crear publicacion</h3>
            <textarea id="postContenido" placeholder="Que estas pensando?"></textarea>
            <div class="create-post-tools">
              <label class="media-picker" for="postMediaInput">Agregar fotos o videos</label>
              <input id="postMediaInput" type="file" accept="image/*,video/*" multiple />
              <span id="postMediaInfo" class="post-media-info">Puedes subir hasta 4 archivos.</span>
            </div>
            <button id="btnCrearPost" class="post-btn" type="button">Publicar</button>
            <p id="postMessage" class="post-message"></p>
          </article>

          <section class="posts-section">
            <div id="postsContainer"></div>
          </section>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
