<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect | Feed</title>
  <link rel="stylesheet" href="css/feed.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-section">
        <div class="brand-icon">🎓</div>
        <h1>CampusConnect</h1>
      </div>

      <nav class="menu">
        <button class="menu-btn active">Home Feed</button>
        <button class="menu-btn">Study Group Finder</button>
        <button class="menu-btn">Student Profile</button>
        <button class="menu-btn">Messages</button>
      </nav>

      <div class="sidebar-footer">
        <button class="logout-btn" onclick="logout()">Cerrar sesión</button>
      </div>
    </aside>

    <main class="content">
      <section class="top-section">
        <h2 class="section-title">Home Feed</h2>

        <article class="create-post-card">
          <h3>Crear publicación</h3>
          <textarea id="postContenido" placeholder="¿Qué estás pensando?"></textarea>
          <button id="btnCrearPost" class="post-btn">Publicar</button>
          <p id="postMessage" class="post-message"></p>
        </article>

        <section class="posts-section">
          <div id="postsContainer"></div>
        </section>
      </section>

      <section class="profile-section">
        <h2 class="section-title">Student Profile</h2>

        <article class="profile-card">
          <div class="profile-header">
            <img id="fotoPerfil" class="avatar" src="https://via.placeholder.com/90?text=👤" alt="Foto de perfil" />
            <div>
              <h3 id="nombreUsuario">Cargando...</h3>
              <p id="correoUsuario">Cargando correo...</p>
            </div>
          </div>

          <div class="profile-photo-upload">
            <input id="fotoInput" type="file" accept="image/*" />
            <button id="btnSubirFoto" class="post-btn" type="button">Actualizar foto</button>
          </div>

          <div class="profile-block">
            <h4>Carrera</h4>
            <p id="carreraUsuario">Cargando carrera...</p>
          </div>
        </article>
      </section>

      <section class="messages-section">
        <h2 class="section-title">Chat en tiempo real</h2>

        <article class="chat-card">
          <div id="chatMessages" class="chat-messages"></div>

          <div class="chat-input-row">
            <input id="chatInput" type="text" placeholder="Escribe un mensaje..." />
            <button id="btnSendChat" class="chat-btn" type="button">Enviar</button>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
