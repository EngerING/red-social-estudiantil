<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusConnect | Crear cuenta</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card register-card">
      <div class="brand-circle">🎓</div>
      <h1>Crear cuenta</h1>
      <p class="subtitle">Únete a CampusConnect</p>

      <form id="registerForm" class="auth-form">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required />

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" placeholder="Tu apellido" required />

        <label for="email">Correo</label>
        <input type="email" id="email" placeholder="ejemplo@correo.com" required />

        <label for="carrera">Carrera</label>
        <input type="text" id="carrera" placeholder="Ej. Ingeniería de Software" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required />

        <button type="submit" class="primary-btn">Crear cuenta</button>

        <p id="registerMessage" class="message"></p>
      </form>

      <div class="auth-footer">
        <span>¿Ya tienes cuenta?</span>
        <a href="login.html">Ir al login</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
